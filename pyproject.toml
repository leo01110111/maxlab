[project]
name = "mujoco-musings"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "mujoco>=3.9.0",
    "opencv-python>=4.13.0.92",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Import names are the scene package directories; distribution name stays
# "mujoco-musings" above -- that's normal (e.g. "opencv-python" -> "cv2").
[tool.setuptools.packages.find]
include = ["urtable_sim*", "urgantry_sim*", "urgantry_bc*", "urgantry_hug*"]

# Non-.py assets (robot/gripper MJCF, meshes, textures) that the build_* modules
# load at runtime via paths resolved next to them (see ASSET_DIR).
[tool.setuptools.package-data]
urtable_sim = ["**/*.xml", "**/*.stl", "**/*.obj", "**/*.mtl", "**/*.png"]
urgantry_sim = ["**/*.xml", "**/*.stl", "**/*.obj", "**/*.mtl", "**/*.png"]
